name: PR Quality Check

on:
  pull_request:
    branches: ["master"]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run Linter
        run: npm run lint
      - name: Build Check
        run: npm run build
